name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Или ваша основная ветка

permissions:
  contents: read
  pages: write
  id-token: write

env:
  VITE_YANDEX_API_KEY: ${{ secrets.VITE_YANDEX_API_KEY }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        run: npm run build

      - name: Inject VITE_YANDEX_API_KEY
        run: |
          # Экранируем специальные символы в API ключе
          ESCAPED_API_KEY=$(echo "${{ secrets.VITE_YANDEX_API_KEY }}" | sed 's/[&/\]/\\&/g')
          # Заменяем комментарий на script тег с API ключом
          sed -i "s|<!-- VITE_YANDEX_API_KEY -->|<script>window.VITE_YANDEX_API_KEY=\"$ESCAPED_API_KEY\"</script>|" dist/index.html

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
